name: Build Check

on:
  # Other branches are tested through their pull request, which also checks the merge with
  # master: a push trigger on every branch ran each one twice and queued macOS jobs for hours.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a pull request makes its previous run pointless. Runs on master are kept, so
# every commit there keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request is merged with a merge commit. When master has not moved since the pull
  # request's last green run, that commit holds exactly the files the run tested, and running
  # everything again on master only queued macOS jobs behind the next pull request. Each green
  # pull request run records the tree it tested as a commit status on the pull request's head
  # (`record-tested-tree` below); a push to master whose tree matches one is skipped. Anything
  # else, a pull request merged onto a newer master, a direct push or a manual run, runs in full.
  decide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          skip=false
          if [ "$EVENT" = "push" ]; then
            commit=$(gh api "repos/$REPO/commits/$SHA")
            tree=$(jq -r '.commit.tree.sha' <<<"$commit")
            set -- $(jq -r '[.parents[].sha] | join(" ")' <<<"$commit")
            if [ $# -eq 2 ]; then
              matches=$(gh api "repos/$REPO/commits/$2/statuses" --paginate \
                --jq "[.[] | select(.context == \"tested-tree\" and .state == \"success\" and .description == \"$tree\")] | length" \
                | awk '{ n += $1 } END { print n + 0 }')
              [ "${matches:-0}" -gt 0 ] && skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Skip the macOS jobs: $skip"

  build:
    needs: decide
    if: ${{ needs.decide.outputs.skip != 'true' }}
    timeout-minutes: 110
    # Pinned to the macOS 26 runner: it ships only Xcode 26.x (macOS 26 SDK), so the
    # Apple Speech engine (SpeechTranscriber/AssetInventory, gated on
    # `#if canImport(FoundationModels)`) is always compiled and tested. `macos-latest`
    # (macOS 15) rotates its default Xcode between 16.4 and 26.5, which non-deterministically
    # dropped the whole Apple Speech path and broke builds depending on which runner we drew.
    runs-on: macos-26
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install cmake rust
      - name: Set up Ruby (for xcpretty)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Install xcpretty
        run: gem install xcpretty
      - name: Make run.sh executable
        run: chmod +x ./run.sh
      # Same inputs as the stamp of Scripts/build-native.sh, which restores its stamp with the
      # outputs and skips the native build when nothing changed.
      - name: Compute the native build cache key
        id: native-key
        run: |
          inputs=$( (git submodule status libwhisper | awk '{print $1, $2}'; xcodebuild -version; cmake --version) | shasum -a 256 | cut -d' ' -f1)
          echo "key=native-${inputs}" >> "$GITHUB_OUTPUT"
      - name: Restore the native xcframeworks
        uses: actions/cache@v6
        with:
          path: OpenSuperWhisperCore/Binaries
          key: ${{ steps.native-key.outputs.key }}-${{ hashFiles('Scripts/build-native.sh', 'Scripts/fetch-sherpa.sh', 'libwhisper/CMakeLists.txt') }}
      - name: Build with run.sh
        run: ./run.sh build
      # Serial, on run.sh's derived data, its patched FluidAudio checkout and the core's
      # xcframeworks it built or restored from the cache above. Only
      # KeyboardLayoutProviderTests is skipped here, because it switches the system keyboard
      # layout; tests that need a Bluetooth microphone or a notched screen skip themselves.
      # TEST_RUNNER_OSW_GOLDEN_MACHINE=0 skips every test that runs Whisper (goldens, VAD pins, the
      # context lifecycle), since their outputs are only promised on Apple Silicon with its own
      # GPU: CI does not exercise Whisper inference. A failing test runs once more and the summary
      # names any that only passed on that retry: the timing-sensitive ones (ErrorFeedbackTests,
      # ClipboardRestoreTests) should hold on a VM, as their timers and checks share the main
      # queue, and a retry shows when they do not.
      - name: Run the unit tests
        # The layout suite renders every pane in eight languages at three sizes, about half an
        # hour on its own on a hosted runner.
        timeout-minutes: 60
        env:
          TEST_RUNNER_OSW_GOLDEN_MACHINE: "0"
          # Pull requests: English and German only, see SettingsLayoutTests.languages.
          TEST_RUNNER_OSW_LAYOUT_LANGUAGES: ${{ github.event_name == 'pull_request' && 'en,de' || '' }}
        run: |
          set -o pipefail
          xcodebuild test -scheme OpenSuperWhisper -derivedDataPath build -clonedSourcePackagesDirPath SourcePackages \
            -destination 'platform=macOS,arch=arm64' -skipPackagePluginValidation -skipMacroValidation \
            -only-testing:OpenSuperWhisperTests \
            -skip-testing:OpenSuperWhisperTests/KeyboardLayoutProviderTests \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | xcpretty --simple --color
      - name: Summarize the unit tests
        if: ${{ !cancelled() && hashFiles('build/TestResults.xcresult/Info.plist') != '' }}
        run: |
          results=build/TestResults.xcresult
          summary=$(xcrun xcresulttool get test-results summary --path "$results")
          {
            echo "### Unit tests: $(jq -r .result <<< "$summary")"
            jq -r '"\(.passedTests) passed, \(.failedTests) failed, \(.skippedTests) skipped"' <<< "$summary"
            jq -r '.testFailures[] | "- failed: \(.testIdentifierString // .testName): \(.failureText)"' <<< "$summary"
            tests=$(xcrun xcresulttool get test-results tests --path "$results")
            jq -r '.. | objects | select(.nodeType? == "Test Case" and .result? == "Passed")
              | select(any(.children[]?; .nodeType == "Repetition" and .result == "Failed"))
              | "- passed only on retry: \(.nodeIdentifier): \([.. | objects | select(.nodeType? == "Failure Message") | .name][0])"' <<< "$tests"
            jq -r '.. | objects | select(.nodeType? == "Test Case" and .result? == "Skipped") | "- skipped: \(.nodeIdentifier)"' <<< "$tests"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # Every entry in the hand-maintained catalog carries all seven non-source locales. Catalog
      # completeness only: the source-key half is uncovered, because `SettingRow` takes a String
      # title (its settings-search identity) and localizes at runtime, so the toolchain cannot
      # see those literals. Nothing else checks the catalog, and a missing translation ships as
      # English with no signal.
      - name: Check the localization catalog
        if: ${{ !cancelled() }}
        run: Scripts/check-localizations.sh
      # No test the map moved to the core (docs/test-moves-slice5.txt) came back to the hosted
      # suite. The comparison with the frozen slice-4 reference (--slice5) is local only, since a
      # PR that adds, renames or removes a hosted test differs from it by design.
      - name: Check the hosted tests against the moves to the core
        if: ${{ !cancelled() && hashFiles('build/TestResults.xcresult/Info.plist') != '' }}
        run: Scripts/check-test-moves.sh --hosted build/TestResults.xcresult

  # The core package's own tests (docs/core-extraction.md, slice 5), on macOS and on the iOS
  # Simulator, through Scripts/test-core.sh like a local run. Its native cache holds the iOS
  # slices too, under a key of its own so it never overwrites the build job's macOS-only one.
  # TEST_RUNNER_OSW_GOLDEN_MACHINE=0 skips the exact whisper strings; the one cpu-only whisper
  # smoke test still runs on both destinations, without the paravirtual GPU. The llama tests
  # skip, since CI has no GGUF model.
  # On a cold cache the native build, run.sh's app build and the two core builds can take most
  # of the step budgets, so the job allows their sum.
  core-tests:
    needs: decide
    if: ${{ needs.decide.outputs.skip != 'true' }}
    runs-on: macos-26
    timeout-minutes: 140
    env:
      TEST_RUNNER_OSW_GOLDEN_MACHINE: "0"
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install cmake rust
      - name: Compute the native build cache key
        id: native-key
        run: |
          inputs=$( (git submodule status libwhisper | awk '{print $1, $2}'; xcodebuild -version; cmake --version) | shasum -a 256 | cut -d' ' -f1)
          echo "key=native-${inputs}" >> "$GITHUB_OUTPUT"
      - name: Restore the native xcframeworks, iOS slices included
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: OpenSuperWhisperCore/Binaries
          key: ${{ steps.native-key.outputs.key }}-all-${{ hashFiles('Scripts/build-native.sh', 'Scripts/fetch-sherpa.sh', 'libwhisper/CMakeLists.txt') }}
      # Before run.sh, so the stamp already covers the macOS slices run.sh asks for.
      - name: Build the native slices for macOS and iOS
        timeout-minutes: 45
        run: Scripts/fetch-sherpa.sh && Scripts/build-native.sh all
      # Saved as soon as it is built: actions/cache only saves when the whole job succeeds, so a
      # red test run would throw the native build away and every retry would redo it.
      - name: Save the native xcframeworks
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: OpenSuperWhisperCore/Binaries
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      # Resolves SourcePackages, patches FluidAudio, and shows the app still builds.
      - name: Build with run.sh
        timeout-minutes: 30
        run: ./run.sh build
      - name: Run the core tests on macOS
        id: core-macos
        timeout-minutes: 25
        run: |
          Scripts/test-core.sh macos -resultBundlePath build-core/macos.xcresult \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300
      # test-core.sh picks the newest iPhone simulator the selected Xcode can target, since
      # macos-26 images carry several Xcodes and simctl lists the runtimes of all of them. Runs
      # after a macOS failure too, so an iOS-only regression shows in the same run.
      - name: Run the core tests on the iOS Simulator
        if: ${{ !cancelled() && steps.core-macos.outcome != 'skipped' }}
        timeout-minutes: 30
        run: |
          Scripts/test-core.sh ios -resultBundlePath build-core/ios.xcresult \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300
      - name: Summarize the core tests and check the moves
        if: ${{ !cancelled() }}
        run: |
          for destination in macos ios; do
            results=build-core/$destination.xcresult
            [ -f "$results/Info.plist" ] || { echo "### Core tests ($destination): no results" | tee -a "$GITHUB_STEP_SUMMARY"; continue; }
            summary=$(xcrun xcresulttool get test-results summary --path "$results")
            tests=$(xcrun xcresulttool get test-results tests --path "$results")
            {
              echo "### Core tests ($destination): $(jq -r .result <<< "$summary")"
              jq -r '"\(.passedTests) passed, \(.failedTests) failed, \(.skippedTests) skipped"' <<< "$summary"
              jq -r '.testFailures[] | "- failed: \(.testIdentifierString // .testName): \(.failureText)"' <<< "$summary"
              jq -r '.. | objects | select(.nodeType? == "Test Case" and .result? == "Passed")
                | select(any(.children[]?; .nodeType == "Repetition" and .result == "Failed"))
                | "- passed only on retry: \(.nodeIdentifier)"' <<< "$tests"
              jq -r '.. | objects | select(.nodeType? == "Test Case" and .result? == "Skipped") | "- skipped: \(.nodeIdentifier)"' <<< "$tests"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
          Scripts/check-test-moves.sh --core-macos build-core/macos.xcresult --core-ios build-core/ios.xcresult
      - name: Upload the core test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: core-test-results
          path: |
            build-core/macos.xcresult
            build-core/ios.xcresult
          if-no-files-found: ignore

  # The Intel lane of notarize_app.sh, unsigned: nothing else compiles the x86_64 app, where
  # SenseVoice and onnxruntime must stay out. Built on Apple Silicon like a release, not tested.
  release-x86_64:
    needs: decide
    if: ${{ needs.decide.outputs.skip != 'true' }}
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
      # cmake for Scripts/build-native.sh. The script rebuilds the core's xcframeworks with
      # RELEASE=1, as a release does, before packages resolve, so the build job's cache of
      # OpenSuperWhisperCore/Binaries is not restored here.
      - name: Install dependencies
        run: brew install cmake
      # No vendored autocorrect on CI, so it is built from source for both architectures, with
      # rustup where notarize_app.sh expects it.
      - name: Install Rust with the x86_64 target
        run: |
          [ -x "$HOME/.cargo/bin/rustup" ] \
            || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          "$HOME/.cargo/bin/rustup" toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          "$HOME/.cargo/bin/rustup" default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build Release for x86_64, unsigned
        run: ./Scripts/build-release-unsigned.sh x86_64
      - name: Check the Intel app leaves onnxruntime and libomp out
        run: |
          app=build-release/x86_64/Build/Products/Release/OpenSuperWhisper.app
          exe="$app/Contents/MacOS/OpenSuperWhisper"
          test "$(lipo -archs "$exe")" = x86_64
          loads=$(otool -L "$exe"); undefined=$(nm -u "$exe")
          if grep -q onnxruntime <<< "$loads" || grep -q _OrtGetApiBase <<< "$undefined" \
             || compgen -G "$app/Contents/Frameworks/libonnxruntime*" > /dev/null; then
            echo "::error::the x86_64 app links, references or embeds onnxruntime, which is arm64 only"
            exit 1
          fi
          if grep -q libomp <<< "$loads" || compgen -G "$app/Contents/Frameworks/libomp*" > /dev/null; then
            echo "::error::the x86_64 app links or embeds libomp, which the core's native build does not use"
            exit 1
          fi

  # Measures the Parakeet over-boost risk as a number rather than an assumption (#89, #235).
  #
  # The benchmark wants a folder of WAVs with a `_refs.json`; those are local material that is not
  # in the repo, and a runner has the hardware but not the fixtures. So the clips are synthesised
  # here with `say`, carrying the benchmark's own `spokenTerms` in ordinary sentences.
  #
  # READ THE RESULT WITH THIS CAVEAT: synthetic speech is cleaner than human speech — no accent,
  # no room noise, no hesitation — so these counts BOUND the false-replacement risk. They do not
  # reproduce #235's numbers, and a low count here is not evidence that a dictation in a noisy
  # room is safe.
  #
  # Manual only: it downloads the ASR and CTC models and takes the better part of an hour, and no
  # pull request depends on it.
  parakeet-overboost:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      # The setup below mirrors `core-tests`: the benchmark builds against the same native
      # slices, the same patched FluidAudio checkout, and the same workspace pins.
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install cmake rust
      - name: Compute the native build cache key
        id: native-key
        run: |
          inputs=$( (git submodule status libwhisper | awk '{print $1, $2}'; xcodebuild -version; cmake --version) | shasum -a 256 | cut -d' ' -f1)
          echo "key=native-${inputs}" >> "$GITHUB_OUTPUT"
      - name: Restore the native xcframeworks, iOS slices included
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: OpenSuperWhisperCore/Binaries
          key: ${{ steps.native-key.outputs.key }}-all-${{ hashFiles('Scripts/build-native.sh', 'Scripts/fetch-sherpa.sh', 'libwhisper/CMakeLists.txt') }}
      - name: Build the native slices for macOS and iOS
        timeout-minutes: 45
        run: Scripts/fetch-sherpa.sh && Scripts/build-native.sh all
      - name: Save the native xcframeworks
        if: ${{ steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: OpenSuperWhisperCore/Binaries
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build with run.sh
        timeout-minutes: 30
        run: ./run.sh build
      - name: Synthesise labelled clips
        run: |
          mkdir -p clips
          python3 - <<'PY' > clips/sentences.txt
          sentences = [
              "We drove to Sintra before the rain started.",
              "The Marianas trench is deeper than anything on land.",
              "Dunlap said the meeting would move to Thursday.",
              "Bennet left the keys on the kitchen table.",
              "Nyiragongo erupted again last year.",
              "Book the flight to Sintra and call Dunlap from the airport.",
              "Bennet and Nyiragongo appear in the same paragraph of the report.",
          ]
          for sentence in sentences:
              print(sentence)
          PY
          i=0
          while IFS= read -r sentence; do
            say -o "clips/clip-$i.aiff" "$sentence"
            afconvert -f WAVE -d LEI16@16000 -c 1 "clips/clip-$i.aiff" "clips/clip-$i.wav"
            rm "clips/clip-$i.aiff"
            i=$((i + 1))
          done < clips/sentences.txt
          python3 - <<'PY'
          import json
          sentences = [line.rstrip("\n") for line in open("clips/sentences.txt", encoding="utf-8")
                       if line.strip()]
          refs = [{"file": f"clip-{i}.wav", "ref": sentence} for i, sentence in enumerate(sentences)]
          with open("clips/_refs.json", "w", encoding="utf-8") as handle:
              json.dump(refs, handle, indent=1)
          PY
          ls -l clips
      # `TEST_RUNNER_` is how xcodebuild forwards an environment variable into the test process,
      # and `Scripts/test-core.sh` documents it. Without the prefix the benchmark skips itself and
      # the step would pass having measured nothing — which is what the report check below is for.
      - name: Run the benchmark
        timeout-minutes: 40
        run: |
          TEST_RUNNER_OSW_PARAKEET_BENCH="$PWD/clips" \
          TEST_RUNNER_OSW_PARAKEET_BENCH_OUT="$PWD/bench.json" \
            Scripts/test-core.sh macos \
              -only-testing:OpenSuperWhisperCoreTests/ParakeetBoostBenchmark
      - name: Report the bait counts and fail if the boost adds any
        run: |
          if [[ ! -f bench.json ]]; then
            echo "::error::the benchmark wrote no report — it skipped, so the environment did not reach the test process"
            exit 1
          fi
          cat bench.json
          python3 - <<'PY'
          import json
          import os
          import sys

          with open("bench.json", encoding="utf-8") as handle:
              report = json.load(handle)

          none = report["none"]["baits"]
          terms = report["terms"]["baits"]
          lines = [
              "### Parakeet over-boost benchmark (synthetic clips)",
              "",
              "| arm | bait replacements | WER |",
              "|---|---|---|",
              f"| no terms | {none} | {report['none']['wer']:.3f} |",
              f"| terms | {terms} | {report['terms']['wer']:.3f} |",
              "",
              "Synthetic speech is cleaner than human speech, so this bounds the risk; it does not",
              "reproduce #235's numbers.",
          ]
          summary = "\n".join(lines)
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary + "\n")

          if terms > none:
              sys.exit(f"the boost added {terms - none} bait replacement(s): {none} -> {terms}")
          PY
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: parakeet-overboost-report
          path: bench.json
          if-no-files-found: warn

  # Records the tree a green pull request run tested, for `decide` on the push that merges it.
  # A pull request from a fork gets a read-only token and records nothing, so its merge runs
  # in full, as before.
  record-tested-tree:
    needs: [build, core-tests, release-x86_64]
    if: ${{ github.event_name == 'pull_request' && success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE: ${{ github.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          tree=$(gh api "repos/$REPO/commits/$MERGE" --jq '.commit.tree.sha')
          gh api -X POST "repos/$REPO/statuses/$HEAD" -f state=success -f context=tested-tree \
            -f description="$tree" || echo "No permission to record the tested tree (fork)."
