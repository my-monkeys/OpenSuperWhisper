name: Build Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pinned to the macOS 26 runner: it ships only Xcode 26.x (macOS 26 SDK), so the
    # Apple Speech engine (SpeechTranscriber/AssetInventory, gated on
    # `#if canImport(FoundationModels)`) is always compiled and tested. `macos-latest`
    # (macOS 15) rotates its default Xcode between 16.4 and 26.5, which non-deterministically
    # dropped the whole Apple Speech path and broke builds depending on which runner we drew.
    runs-on: macos-26
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install cmake libomp rust
      - name: Set up Ruby (for xcpretty)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Install xcpretty
        run: gem install xcpretty
      - name: Make run.sh executable
        run: chmod +x ./run.sh
      # Same inputs as the stamp of Scripts/build-native.sh, which restores its stamp with the
      # outputs and skips the native build when nothing changed.
      - name: Compute the native build cache key
        id: native-key
        run: |
          inputs=$( (git submodule status libwhisper | awk '{print $1, $2}'; xcodebuild -version; cmake --version) | shasum -a 256 | cut -d' ' -f1)
          echo "key=native-${inputs}" >> "$GITHUB_OUTPUT"
      - name: Restore the native xcframeworks
        uses: actions/cache@v4
        with:
          path: OpenSuperWhisperCore/Binaries
          key: ${{ steps.native-key.outputs.key }}-${{ hashFiles('Scripts/build-native.sh', 'Scripts/fetch-sherpa.sh', 'libwhisper/CMakeLists.txt') }}
      - name: Build with run.sh
        run: ./run.sh build 
