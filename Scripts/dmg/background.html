<!doctype html>
<!-- Source of background.png and background@2x.png, the picture behind the DMG window.
     Render: Scripts/dmg/render-background.sh. Icon centres must match settings.py.
     Everything sits in the top 300 points: Finder on macOS 26 and later keeps its toolbar, and
     some people show the path bar, which leaves about 320 of the window's 420 for the picture. -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&family=Lilita+One&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 640px; height: 400px; overflow: hidden; }
  body { position: relative; background: #fff9f5; color: #38251f; font-family: "DM Sans", sans-serif; }
  h1 { position: absolute; top: 34px; width: 100%; margin: 0; text-align: center;
       font: 400 32px/1 "Lilita One", sans-serif; letter-spacing: -.01em; }
  h1 em { font-style: normal; color: #e8734a; }
  p { position: absolute; top: 276px; width: 100%; margin: 0; text-align: center;
      font-size: 13px; color: #75584d; }
  svg { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
  <h1>Drag me to <em>Applications</em></h1>
  <svg width="640" height="400" viewBox="0 0 640 400" fill="none" stroke="#e8734a" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 160 C 300 130, 340 130, 378 152"/>
    <path d="M371 137 L 378 152 L 362 153"/>
  </svg>
  <p>Then open OpenSuperWhisper from Applications or Spotlight.</p>
</body>
</html>
